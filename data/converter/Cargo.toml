[package]
name = "japan-map-converter"
version = "0.1.0"
edition = "2024"
description = "data/raw の基盤地図情報（FG-GML）を data/edited に変換する"
publish = false

[dependencies]
anyhow = "=1.0.104"
geo = "=0.33.1"
i_overlay = "=9.1.0"
quick-xml = "=0.42.0"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
walkdir = "=2.5.0"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
